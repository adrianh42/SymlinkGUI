<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Mask for the interlocking link crossover gap -->
    <mask id="link-gap-mask">
      <rect x="-256" y="-256" width="512" height="512" fill="white" />
      <!-- Gap cutout around the intersection -->
      <circle cx="0" cy="-38" r="28" fill="black" />
    </mask>
  </defs>

  <!-- Blue Squircle Tile -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#01499E" />

  <!-- Centered Diagonal Flat Link Symbol -->
  <g transform="translate(256 256) rotate(-45)">
    <!-- Base link (Top-Right Loop) -->
    <rect x="8" y="-48" width="180" height="96" rx="48" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round" />

    <!-- Interlocking link (Bottom-Left Loop) with gap mask -->
    <rect x="-188" y="-48" width="180" height="96" rx="48" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round" mask="url(#link-gap-mask)" />

    <!-- Bridge strand passing over the gap to complete the interlock -->
    <path d="M -188 -48 L -8 -48" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />
  </g>
</svg>
