name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Portable win-x64
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          ./build-portable.ps1 -Runtime win-x64 -Version $ver

      - name: Build Portable win-arm64
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          ./build-portable.ps1 -Runtime win-arm64 -Version $ver

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SymlinkGUI-Portable-*.zip
          generate_release_notes: true
