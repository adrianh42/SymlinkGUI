name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Portable win-x64
        shell: pwsh
        run: ./build-portable.ps1 -Runtime win-x64

      - name: Build Portable win-arm64
        shell: pwsh
        run: ./build-portable.ps1 -Runtime win-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SymlinkGUI-Portable-win-x64.zip
            dist/SymlinkGUI-Portable-win-arm64.zip
          generate_release_notes: true
